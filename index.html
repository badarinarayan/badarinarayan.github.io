function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function truncate(s,n){if(!s)return'';s=s.trim();return s.length>n?s.slice(0,n)+'…':s;}
function fmtDate(s){if(!s)return'';try{const d=new Date(s);if(isNaN(d))return'';return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}

async function fetchRSS(url,count=10){
  const r2j=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=${count}`;
  try{const r=await fetch(r2j,{signal:AbortSignal.timeout(7000)});if(r.ok){const j=await r.json();if(j.status==='ok'&&j.items?.length)return{items:j.items};}}catch(e){}
  try{const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(7000)});if(r.ok){const j=await r.json();const parser=new DOMParser();const doc=parser.parseFromString(j.contents,'text/xml');const els=Array.from(doc.querySelectorAll('item,entry'));const items=els.slice(0,count).map(el=>({title:el.querySelector('title')?.textContent?.trim()||'',link:el.querySelector('link')?.getAttribute('href')||el.querySelector('link')?.textContent?.trim()||el.querySelector('guid')?.textContent||'#',pubDate:el.querySelector('pubDate')?.textContent||el.querySelector('published')?.textContent||el.querySelector('updated')?.textContent||'',description:stripHtml(el.getElementsByTagNameNS('*','encoded')[0]?.textContent||el.querySelector('description,summary')?.textContent||''),thumbnail:null})).filter(i=>i.title);if(items.length)return{items};}}catch(e){}
  return{items:[]};
}

// ── Shared UI ──────────────────────────────────────────────────────────
function SectionHeader({label,sub,dark=false}) {
  return (
    <div style={{marginBottom:'2rem'}}>
      <div style={{display:'flex',alignItems:'center',gap:'0.75rem',marginBottom:'0.4rem'}}>
        <div style={{width:24,height:2,background:'var(--amber)',flexShrink:0}}/>
        <h2 style={{fontFamily:"'Libre Baskerville',serif",fontSize:'1.5rem',color:dark?'var(--paper)':'var(--ink)',letterSpacing:'-0.01em'}}>{label}</h2>
      </div>
      {sub&&<p style={{fontSize:'0.73rem',color:dark?'rgba(248,245,239,0.45)':'var(--muted)',marginLeft:36}}>{sub}</p>}
      <div style={{height:1,background:dark?'rgba(248,245,239,0.1)':'var(--border)',marginTop:'1.25rem'}}/>
    </div>

function SkeletonCard() {
  return (
    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:2,overflow:'hidden'}}>
      <div className="skeleton" style={{height:140}}/>
      <div style={{padding:'1rem 1.1rem',display:'flex',flexDirection:'column',gap:'0.5rem'}}>
        <div className="skeleton" style={{height:8,width:'28%'}}/><div className="skeleton" style={{height:14,width:'88%'}}/><div className="skeleton" style={{height:11,width:'68%'}}/>
      </div>
    </div>
  );
}

function ArticleCard({article}) {
  const isEmoji = article.image && article.image.length<=4 && !article.image.startsWith('http');
  const cols = {Medium:'#00ab6c',LinkedIn:'#0077b5',Site:'#c47a0f',Sampada:'#7b3fa0'};
  const col = cols[article.platform]||'var(--amber)';
  const cta = article.platform==='LinkedIn' ? 'View Post →' : article.platform==='Site' ? 'Read Article →' : article.platform==='Sampada' ? 'Read on Sampada →' : 'Read →';
  const isExternal = article.url.startsWith('http');
  const [hov,setHov] = useState(false);
  return (
    <a href={article.url} target={isExternal?'_blank':'_self'} rel={isExternal?'noopener':undefined}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{display:'flex',flexDirection:'column',background:'var(--card)',border:'1px solid var(--border)',borderRadius:2,overflow:'hidden',textDecoration:'none',color:'inherit',transform:hov?'translateY(-3px)':'none',boxShadow:hov?'0 8px 24px rgba(15,13,9,0.1)':'none',transition:'transform 0.2s,box-shadow 0.2s',height:'100%'}}>
      {isEmoji
        ?<div style={{background:'var(--amber-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem',height:120}}>{article.image}</div>
        :<div style={{overflow:'hidden',height:140,background:'var(--cream)'}}>{article.image&&<img src={article.image} alt="" loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',transform:hov?'scale(1.05)':'none',transition:'transform 0.4s',display:'block'}} onError={e=>e.currentTarget.style.display='none'}/>}</div>
      }
      <div style={{padding:'1rem 1.1rem',flex:1,display:'flex',flexDirection:'column',gap:'0.35rem'}}>
        <span style={{fontSize:'0.58rem',letterSpacing:'0.18em',textTransform:'uppercase',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,color:col,display:'flex',alignItems:'center',gap:5}}>
          <span style={{width:5,height:5,borderRadius:'50%',background:col,display:'inline-block'}}/>{article.platform}
        </span>
        <h3 style={{fontFamily:"'Libre Baskerville',serif",fontSize:'0.95rem',lineHeight:1.35,color:'var(--ink)'}}>{article.title}</h3>
        <p style={{fontSize:'0.78rem',lineHeight:1.6,color:'var(--muted)',flex:1}}>{truncate(article.excerpt||'',120)}</p>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'0.6rem',borderTop:'1px solid var(--border)',marginTop:'auto'}}>
          <span style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(article.date)}</span>
          <span style={{fontSize:'0.7rem',color:'var(--amber)',fontWeight:600}}>{cta}</span>
        </div>
      </div>
    </a>
  );
}

// ── Writings ───────────────────────────────────────────────────────────
function WritingsSection() {
  const [medium,setMedium]=useState([]);
  const [ms,setMs]=useState('loading');
  const [tab,setTab]=useState('all');
  useEffect(()=>{
    fetchRSS(`https://medium.com/feed/@badarinarayan`,10).then(({items})=>{
      if(!items.length){setMs('error');return;}
      setMedium(items.map(i=>{const m=i.description?.match(/<img[^>]+src="([^"]+)"/);return{platform:'Medium',url:i.link,title:i.title,excerpt:stripHtml(i.description||''),image:i.thumbnail||(m?m[1]:null),date:i.pubDate};}).sort((a,b)=>new Date(a.date)-new Date(b.date)));
      setMs('ok');
    }).catch(()=>setMs('error'));
  },[]);
  const all=[...medium,...CONFIG.manualArticles,...CONFIG.localArticles,...(CONFIG.sampadaArticles||[])];
  const shown=tab==='all'?all:tab==='medium'?medium:tab==='site'?CONFIG.localArticles:tab==='sampada'?(CONFIG.sampadaArticles||[]):CONFIG.manualArticles.filter(a=>a.platform==='LinkedIn');
  const loading=tab==='all'&&ms==='loading'||tab==='medium'&&ms==='loading';
  return (
    <div className="section-pad" style={{maxWidth:1100,margin:'0 auto',padding:'2.5rem 2rem'}}>
      <SectionHeader label="My Writings" sub="Articles & posts from Medium and LinkedIn"/>
      <div style={{display:'flex',gap:'0.4rem',marginBottom:'1.75rem',flexWrap:'wrap'}}>
        {[['all','All'],['medium','Medium'],['linkedin','LinkedIn'],['sampada','Sampada'],['site','This Site']].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{padding:'0.35rem 0.9rem',border:'1px solid',borderRadius:20,fontSize:'0.67rem',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,transition:'all 0.15s',background:tab===id?'var(--ink)':'transparent',borderColor:tab===id?'var(--ink)':'var(--border)',color:tab===id?'var(--paper)':'var(--muted)'}}>
            {label}
          </button>
        ))}
      </div>
      {tab==='medium'&&ms==='error'&&(
        <div style={{padding:'0.875rem 1rem',background:'#fff5f5',border:'1px solid #fcc',borderRadius:2,fontSize:'0.78rem',marginBottom:'1.25rem'}}>
          ⚠️ Medium feed unavailable. <a href={`https://medium.com/feed/@${CONFIG.mediumUsername}`} target="_blank" rel="noopener" style={{color:'var(--amber)'}}>Test RSS →</a>
        </div>
      )}
      <div className="card-grid-auto" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(270px,1fr))',gap:'1.25rem'}}>
        {loading&&[...Array(6)].map((_,i)=><SkeletonCard key={i}/>)}
        {!loading&&shown.map((a,i)=><ArticleCard key={i} article={a}/>)}
        {!loading&&!shown.length&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:'2.5rem',color:'var(--muted)',fontSize:'0.85rem'}}>No articles here yet.</div>}
      </div>
    </div>
  );
}

function VideoCard({video,onPlay}) {

  return (
    <button onClick={()=>onPlay(video)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{display:'flex',flexDirection:'column',background:'var(--card)',border:'1px solid var(--border)',borderRadius:2,overflow:'hidden',textAlign:'left',cursor:'pointer',padding:0,color:'inherit',transform:hov?'translateY(-3px)':'none',boxShadow:hov?'0 8px 24px rgba(15,13,9,0.1)':'none',transition:'transform 0.2s,box-shadow 0.2s',height:'100%'}}>
      <div style={{position:'relative',overflow:'hidden',height:160,background:'var(--cream)'}}>
        <img src={thumb} alt="" loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',transform:hov?'scale(1.05)':'none',transition:'transform 0.4s',display:'block'}}/>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:hov?'rgba(15,13,9,0.25)':'rgba(15,13,9,0.1)',transition:'background 0.2s'}}>
          <div style={{width:52,height:52,borderRadius:'50%',background:'rgba(196,122,15,0.95)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(0,0,0,0.3)'}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--ink)"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div style={{padding:'1rem 1.1rem',flex:1,display:'flex',flexDirection:'column',gap:'0.35rem'}}>
        <span style={{fontSize:'0.58rem',letterSpacing:'0.18em',textTransform:'uppercase',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,color:'#cc0000',display:'flex',alignItems:'center',gap:5}}>
          <span style={{width:5,height:5,borderRadius:'50%',background:'#cc0000',display:'inline-block'}}/>YouTube · {video.categories.join(' · ')}
        </span>
        <h3 style={{fontFamily:"'Libre Baskerville',serif",fontSize:'0.95rem',lineHeight:1.35,color:'var(--ink)'}}>{video.title}</h3>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'0.6rem',borderTop:'1px solid var(--border)',marginTop:'auto'}}>
          <span style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(video.date)}</span>
          <span style={{fontSize:'0.7rem',color:'var(--amber)',fontWeight:600}}>Watch →</span>
        </div>
      </div>
    </button>
  );
}

function VideoModal({video,onClose}) {
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    document.addEventListener('keydown',onKey);
    return ()=>document.removeEventListener('keydown',onKey);
  },[onClose]);
  if(!video)return null;
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:500,background:'rgba(15,13,9,0.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:'1.5rem'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:900}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.75rem'}}>
          <span style={{fontFamily:"'Libre Baskerville',serif",fontSize:'1rem',color:'var(--paper)'}}>{video.title}</span>
          <button onClick={onClose} aria-label="Close" style={{background:'none',border:'none',cursor:'pointer',color:'var(--paper)',padding:4}}>
            <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          </button>
        </div>
        <div style={{position:'relative',paddingBottom:'56.25%',height:0,borderRadius:2,overflow:'hidden',background:'#000'}}>
          <iframe src={`https://www.youtube.com/embed/${video.id}?autoplay=1`} title={video.title} allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowFullScreen style={{position:'absolute',inset:0,width:'100%',height:'100%',border:0}}/>
        </div>
      </div>
    </div>
  );
}

function VideosSection() {
  const videos=CONFIG.videos||[];
  const [path,setPath]=useState([]);
  const [playing,setPlaying]=useState(null);
  const inPath=videos.filter(v=>path.every((seg,i)=>v.categories[i]===seg));
  const depth=path.length;
  const options=Array.from(new Set(inPath.map(v=>v.categories[depth]).filter(Boolean)));
  const pill=(active)=>({padding:'0.35rem 0.9rem',border:'1px solid',borderRadius:20,fontSize:'0.67rem',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,transition:'all 0.15s',background:active?'var(--ink)':'transparent',borderColor:active?'var(--ink)':'var(--border)',color:active?'var(--paper)':'var(--muted)'});
  return (
    <div className="section-pad" style={{maxWidth:1100,margin:'0 auto',padding:'2.5rem 2rem'}}>
      <SectionHeader label="Videos" sub="Educational videos & lessons on YouTube"/>
      <div style={{display:'flex',gap:'0.4rem',marginBottom:options.length?'1rem':'1.75rem',flexWrap:'wrap',alignItems:'center'}}>
        <button onClick={()=>setPath([])} style={pill(!depth)}>All</button>
        {path.map((seg,i)=>(
          <span key={i} style={{display:'flex',gap:'0.4rem',alignItems:'center'}}>
            <span style={{color:'var(--muted)',fontSize:'0.8rem'}}>›</span>
            <button onClick={()=>setPath(path.slice(0,i+1))} style={pill(i===depth-1)}>{seg}</button>
          </span>
        ))}
      </div>
      {options.length>0&&(
        <div style={{display:'flex',gap:'0.4rem',marginBottom:'1.75rem',flexWrap:'wrap'}}>
          {options.map(c=>(
            <button key={c} onClick={()=>setPath([...path,c])} style={pill(false)}>
              {c}
            </button>
          ))}
        </div>
      )}
      <div className="card-grid-auto" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(270px,1fr))',gap:'1.25rem'}}>
        {inPath.map((v,i)=><VideoCard key={i} video={v} onPlay={setPlaying}/>)}
        {!inPath.length&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:'2.5rem',color:'var(--muted)',fontSize:'0.85rem'}}>No videos here yet.</div>}
      </div>
      <VideoModal video={playing} onClose={()=>setPlaying(null)}/>
    </div>
  );
}

    <footer style={{background:'var(--dark)',borderTop:'2px solid var(--amber)',padding:'2.5rem 1.5rem 2rem',textAlign:'center'}}>
      <p style={{fontFamily:"'Libre Baskerville',serif",fontSize:'1.5rem',color:'var(--paper)',marginBottom:'0.35rem'}}>{CONFIG.title}</p>
      <p style={{fontSize:'0.68rem',color:'rgba(248,245,239,0.4)',letterSpacing:'0.18em',textTransform:'uppercase',marginBottom:'1.5rem'}}>{CONFIG.tagline}</p>
      <div style={{display:'flex',gap:'1.25rem',justifyContent:'center',flexWrap:'wrap',marginBottom:'1.5rem'}}>
        {[['Medium','https://badarinarayan.medium.com'],['LinkedIn',CONFIG.linkedinUrl]].map(([l,u])=>(
          <a key={l} href={u} target="_blank" rel="noopener"
            style={{fontSize:'0.63rem',letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(248,245,239,0.38)',textDecoration:'none',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,transition:'color 0.2s'}}
            onMouseEnter={e=>e.currentTarget.style.color='var(--amber)'}
            onMouseLeave={e=>e.currentTarget.style.color='rgba(248,245,239,0.38)'}>{l}</a>
        ))}
      </div>
      <p style={{fontSize:'0.58rem',color:'rgba(248,245,239,0.18)',lineHeight:1.7}}>Hosted on GitHub Pages · Articles fetched live from Medium</p>
    </footer>
  );
}

// ── App ────────────────────────────────────────────────────────────────
const SECTIONS=['home','writings','sampada','videos'];
const sectionFromHash=()=>{ const h=window.location.hash.replace('#',''); return SECTIONS.includes(h)?h:'home'; };

function App() {
  const [section,_setSection]=useState(sectionFromHash);
  const [ticker,setTicker]=useState([]);
  // Update the URL hash whenever we change section, so the link is shareable
  const setSection=s=>{
    _setSection(s);
    if(s==='home') history.replaceState(null,'',window.location.pathname+window.location.search);
    else if(window.location.hash!=='#'+s) window.location.hash=s;
  };
  // React to back/forward navigation and directly-pasted #sampada links
  useEffect(()=>{
    const onHash=()=>_setSection(sectionFromHash());
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);
  useEffect(()=>{
    fetchRSS(`https://medium.com/feed/@badarinarayan`,5).then(({items})=>setTicker(items.map(i=>({title:i.title,url:i.link})))).catch(()=>{});
  },[]);
  // Scroll to top on section change
  useEffect(()=>{ window.scrollTo({top:0,behavior:'smooth'}); },[section]);
  return (
    <div>
      <TopBar activeSection={section} setSection={setSection} tickerItems={ticker}/>
      {section==='home'&&<><Hero setSection={setSection}/><HomePreview setSection={setSection}/></>}
      {section==='writings'&&<WritingsSection/>}
      {section==='sampada'&&<SampadaSection/>}
      {section==='videos'&&<VideosSection/>}
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="visit-counter.js"></script>
